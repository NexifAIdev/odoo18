# Ops droplet: install node_exporter, wire host + container metrics into the
# existing Prometheus/Grafana stack, and provision Grafana dashboards.
#
# Runs over Tailscale as the scoped deploy user (member of the docker group).
# Root-owned files under /opt/stacks are written via a throwaway alpine
# container with a bind mount, so no sudo is required.

name: Ops metrics (node_exporter + Grafana dashboards)

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Configure metrics on nexifai-ops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY_NEXIFAI_OPS }}
          command_timeout: 15m
          script: |
            set -e

            echo '===== node_exporter on ops ====='
            docker rm -f node-exporter 2>/dev/null || true
            docker run -d --name node-exporter --restart unless-stopped \
              --net host --pid host -m 60m \
              -v /:/host:ro,rslave \
              quay.io/prometheus/node-exporter:latest --path.rootfs=/host
            sleep 5
            docker ps --filter name=node-exporter --format '{{.Names}} {{.Status}}'

            echo '===== rewrite prometheus.yml (adds node + cadvisor jobs) ====='
            docker run --rm -v /opt/stacks/monitoring:/m alpine:latest sh -c 'cat > /m/prometheus.yml <<EOF
            global:
              scrape_interval: 60s
            scrape_configs:
              - job_name: blackbox-http
                metrics_path: /probe
                params:
                  module: [http_2xx]
                static_configs:
                  - targets:
                      - https://nexifai-solutions.com
                      - https://odoo.nexifai-solutions.com
                      - https://hermonhealthproducts.com
                      - https://nexifai-solutions.com/odoo
                      - http://100.70.216.2:19999
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: __param_target
                  - source_labels: [__param_target]
                    target_label: instance
                  - target_label: __address__
                    replacement: blackbox:9115
              - job_name: netdata-prod
                metrics_path: /api/v1/allmetrics
                params:
                  format: [prometheus]
                static_configs:
                  - targets:
                      - 100.70.216.2:19999
              - job_name: node
                static_configs:
                  - targets:
                      - 172.17.0.1:9100
                    labels:
                      instance: nexifai-ops
                  - targets:
                      - 100.70.216.2:9100
                    labels:
                      instance: nexifai-prod
              - job_name: cadvisor
                static_configs:
                  - targets:
                      - 100.70.216.2:8080
                    labels:
                      instance: nexifai-prod
            EOF'

            echo '===== provision Grafana dashboards ====='
            docker run --rm -v /opt/stacks/monitoring/dashboards:/d alpine:latest sh -c '
              wget -qO /d/node-exporter-full.json https://grafana.com/api/dashboards/1860/revisions/37/download
              wget -qO /d/cadvisor.json https://grafana.com/api/dashboards/14282/revisions/1/download
              sed -i "s/[$]{DS_PROMETHEUS}/Prometheus/g" /d/node-exporter-full.json /d/cadvisor.json
              sed -i "s/[$]{DS_LOCALHOST}/Prometheus/g" /d/node-exporter-full.json /d/cadvisor.json
              ls -la /d'

            echo '===== reload prometheus + grafana ====='
            docker restart mon-prometheus mon-grafana >/dev/null
            sleep 25

            echo '===== active targets ====='
            curl -s "http://127.0.0.1:9091/api/v1/targets?state=active" \
              | tr ',' '\n' | grep -E '"job"|"health"' | paste - - || true
            echo '===== memory ====='
            free -m | head -2
            echo 'Ops metrics setup complete.'
