# Provision Grafana alerting (email) and set the admin password.
#
# Required repo secrets (you enter these yourself - they are masked in logs):
#   GRAFANA_SMTP_PASSWORD  Gmail App Password (16 chars, no spaces)
#   GRAFANA_ADMIN_PASSWORD Password you want for the Grafana admin user
#
# Alert rules provisioned:
#   - Website/endpoint down (probe_success < 1 for 5m)
#   - Disk usage above 85%
#   - Memory usage above 90%

name: Ops - Grafana alerting + admin password

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Configure Grafana on nexifai-ops
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY_NEXIFAI_OPS }}
          command_timeout: 15m
          envs: SMTP_PASS,ADMIN_PASS
          script: |
            set -e
            if [ -z "$SMTP_PASS" ] || [ -z "$ADMIN_PASS" ]; then
              echo "Missing GRAFANA_SMTP_PASSWORD or GRAFANA_ADMIN_PASSWORD secret."
              exit 1
            fi

            echo '===== write /opt/stacks/monitoring/.env (chmod 600) ====='
            docker run --rm -e SP="$SMTP_PASS" -e AP="$ADMIN_PASS" \
              -v /opt/stacks/monitoring:/m alpine:latest sh -c 'cat > /m/.env <<EOF
            GF_SECURITY_ADMIN_USER=admin
            GF_SECURITY_ADMIN_PASSWORD=$AP
            GF_SMTP_ENABLED=true
            GF_SMTP_HOST=smtp.gmail.com:587
            GF_SMTP_USER=jasper.daguplo777@gmail.com
            GF_SMTP_PASSWORD=$SP
            GF_SMTP_FROM_ADDRESS=jasper.daguplo777@gmail.com
            GF_SMTP_FROM_NAME=NexifAI Grafana
            GF_SMTP_STARTTLS_POLICY=MandatoryStartTLS
            EOF
            chmod 600 /m/.env'

            echo '===== datasource with fixed uid ====='
            docker run --rm -v /opt/stacks/monitoring/provisioning:/p alpine:latest sh -c 'cat > /p/datasources/prom.yml <<\EOF
            apiVersion: 1
            datasources:
              - name: Prometheus
                uid: prom-nexifai
                type: prometheus
                access: proxy
                url: http://prometheus:9090
                isDefault: true
            EOF'

            echo '===== contact point + notification policy ====='
            docker run --rm -v /opt/stacks/monitoring/provisioning:/p alpine:latest sh -c 'mkdir -p /p/alerting && cat > /p/alerting/contactpoints.yml <<\EOF
            apiVersion: 1
            contactPoints:
              - orgId: 1
                name: nexifai-email
                receivers:
                  - uid: nexifai-email-1
                    type: email
                    settings:
                      addresses: jasper.daguplo777@gmail.com
                      singleEmail: true
            EOF
            cat > /p/alerting/policies.yml <<\EOF
            apiVersion: 1
            policies:
              - orgId: 1
                receiver: nexifai-email
                group_by: [alertname, instance]
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 6h
            EOF'

            echo '===== alert rules ====='
            docker run --rm -v /opt/stacks/monitoring/provisioning:/p alpine:latest sh -c 'cat > /p/alerting/rules.yml <<\EOF
            apiVersion: 1
            groups:
              - orgId: 1
                name: nexifai-core
                folder: NexifAI Alerts
                interval: 1m
                rules:
                  - uid: nexifai-endpoint-down
                    title: Endpoint down
                    condition: C
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "{{ \$labels.instance }} is not responding"
                    noDataState: Alerting
                    execErrState: Error
                    data:
                      - refId: A
                        relativeTimeRange:
                          from: 300
                          to: 0
                        datasourceUid: prom-nexifai
                        model:
                          refId: A
                          instant: true
                          expr: probe_success
                      - refId: C
                        datasourceUid: __expr__
                        model:
                          refId: C
                          type: threshold
                          expression: A
                          conditions:
                            - evaluator:
                                type: lt
                                params: [1]
                  - uid: nexifai-disk-high
                    title: Disk above 85 percent
                    condition: C
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "{{ \$labels.instance }} root filesystem is above 85%"
                    noDataState: NoData
                    execErrState: Error
                    data:
                      - refId: A
                        relativeTimeRange:
                          from: 600
                          to: 0
                        datasourceUid: prom-nexifai
                        model:
                          refId: A
                          instant: true
                          expr: 100 - (node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"} * 100)
                      - refId: C
                        datasourceUid: __expr__
                        model:
                          refId: C
                          type: threshold
                          expression: A
                          conditions:
                            - evaluator:
                                type: gt
                                params: [85]
                  - uid: nexifai-memory-high
                    title: Memory above 90 percent
                    condition: C
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "{{ \$labels.instance }} memory usage is above 90%"
                    noDataState: NoData
                    execErrState: Error
                    data:
                      - refId: A
                        relativeTimeRange:
                          from: 600
                          to: 0
                        datasourceUid: prom-nexifai
                        model:
                          refId: A
                          instant: true
                          expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
                      - refId: C
                        datasourceUid: __expr__
                        model:
                          refId: C
                          type: threshold
                          expression: A
                          conditions:
                            - evaluator:
                                type: gt
                                params: [90]
            EOF'

            echo '===== add env_file to grafana service ====='
            docker run --rm -v /opt/stacks/monitoring:/m alpine:latest sh -c 'cat > /m/compose.yaml <<\EOF
            services:
              prometheus:
                image: prom/prometheus:latest
                container_name: mon-prometheus
                restart: unless-stopped
                command:
                  - --config.file=/etc/prometheus/prometheus.yml
                  - --storage.tsdb.retention.time=15d
                volumes:
                  - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
                  - prom-data:/prometheus
                ports:
                  - "127.0.0.1:9091:9090"
                mem_limit: 200m
              blackbox:
                image: prom/blackbox-exporter:latest
                container_name: mon-blackbox
                restart: unless-stopped
                mem_limit: 50m
              grafana:
                image: grafana/grafana-oss:latest
                container_name: mon-grafana
                restart: unless-stopped
                env_file:
                  - ./.env
                environment:
                  - GF_AUTH_ANONYMOUS_ENABLED=true
                  - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
                  - GF_SECURITY_ALLOW_EMBEDDING=true
                volumes:
                  - grafana-data:/var/lib/grafana
                  - ./provisioning:/etc/grafana/provisioning:ro
                  - ./dashboards:/var/lib/grafana/dashboards:ro
                ports:
                  - "127.0.0.1:3001:3000"
                mem_limit: 250m
            volumes:
              prom-data:
              grafana-data:
            EOF'

            echo '===== recreate grafana ====='
            cd /opt/stacks/monitoring
            docker compose up -d 2>&1 | tail -4
            sleep 30

            echo '===== verify ====='
            curl -s -o /dev/null -w 'grafana health: %{http_code}\n' http://127.0.0.1:3001/api/health
            docker logs mon-grafana 2>&1 | grep -iE 'alerting|smtp|provision' | tail -8 || true
            free -m | head -2
            echo 'Grafana alerting configured.'
        env:
          SMTP_PASS: ${{ secrets.GRAFANA_SMTP_PASSWORD }}
          ADMIN_PASS: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
