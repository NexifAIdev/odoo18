# Staging override for docker-compose.yaml.
# Usage (from nexifai_odoo18_docker/ directory, on the deploy server):
#   docker compose -f docker-compose.yaml -f docker-compose.staging.yml -p odoo18-staging up -d --build
#
# This runs a second, fully isolated Odoo+Postgres stack alongside production on the
# same host: distinct container names, distinct project name (so volumes/network are
# auto-namespaced by Compose), and the web port bound only to localhost on the host
# (127.0.0.1:1791) instead of going through nginx-proxy-manager. The staging
# nginx-proxy-manager service is disabled entirely (production's npm_app already owns
# host ports 80/443/81, so staging must not start a second one).
#
# Health check (used by CI): curl -f http://127.0.0.1:1791/web/login

services:
  web:
    container_name: occ-odoo18-web-staging
    ports:
      - "127.0.0.1:1791:1780"

  db:
    container_name: occ-odoo18-db-staging

  npm_app:
    profiles: ["proxy-disabled-in-staging"]
