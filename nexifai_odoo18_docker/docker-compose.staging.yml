# Staging override for docker-compose.yaml.
# Usage (from nexifai_odoo18_docker/ directory, on the deploy server):
#   docker compose -f docker-compose.yaml -f docker-compose.staging.yml -p odoo18-staging up -d --build
#
# Runs a second, fully isolated Odoo+Postgres stack alongside production on the
# same host: distinct container names, distinct project name (volumes/network are
# auto-namespaced by Compose), and the web port bound only to localhost
# (127.0.0.1:1791). Staging must not start a second nginx-proxy-manager
# (production already owns host ports 80/443/81), so npm_app is disabled here.
#
# The db credentials below match odoo/config/odoo.conf (db_user/db_password) so a
# fresh staging database initializes with the user Odoo expects.
#
# Health check (used by CI): curl -f http://127.0.0.1:1791/web/login

services:
  web:
    container_name: occ-odoo18-web-staging
    ports:
      - "127.0.0.1:1791:1780"

  db:
    container_name: occ-odoo18-db-staging
    environment:
      - POSTGRES_USER=odooadmin
      - POSTGRES_PASSWORD=odoomgr

  npm_app:
    profiles: ["proxy-disabled-in-staging"]
