# Credentials come from an untracked .env file next to this compose file
# (nexifai_odoo18_docker/.env on the server), never from git:
#   ODOO_DB_USER=...
#   ODOO_DB_PASSWORD=...
#   ODOO_ADMIN_PASSWD=...
# The web command renders odoo/config/odoo.conf.template with those values at
# container start, so no secrets live in the repository.

services:
  # ====== Odoo Web Service ======
  web:
    build:
      context: ./odoo
      dockerfile: Dockerfile
    container_name: odoo18-web
    volumes:
      - ./odoo/outputs:/odoo/outputs
      - ./odoo/addons:/odoo/addons
      - ./odoo/config:/etc/odoo
      - ./filestore:/var/lib/odoo/filestore
    expose:
      - "1780"  # Custom HTTP port
      - "1782"  # Custom Longpolling port
    depends_on:
      - db
    environment:
      - DEBUGPY_PORT=5678
      - ODOO_DB_USER=${ODOO_DB_USER:?set in nexifai_odoo18_docker/.env}
      - ODOO_DB_PASSWORD=${ODOO_DB_PASSWORD:?set in nexifai_odoo18_docker/.env}
      - ODOO_ADMIN_PASSWD=${ODOO_ADMIN_PASSWD:?set in nexifai_odoo18_docker/.env}
      - ODOO_RC=/tmp/odoo.conf
    command: >
      bash -c 'sed -e "s|__DB_USER__|$${ODOO_DB_USER}|g"
      -e "s|__DB_PASSWORD__|$${ODOO_DB_PASSWORD}|g"
      -e "s|__ADMIN_PASSWD__|$${ODOO_ADMIN_PASSWD}|g"
      /etc/odoo/odoo.conf.template > /tmp/odoo.conf
      && exec /entrypoint.sh odoo -c /tmp/odoo.conf'
    networks:
      - odoo-net

  # ====== PostgreSQL Database ======
  # Credentials match what Odoo receives via odoo.conf.template so a fresh
  # database volume initializes with the user Odoo expects.
  db:
    image: postgres:13
    container_name: odoo18-db
    restart: always
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=${ODOO_DB_USER:?set in nexifai_odoo18_docker/.env}
      - POSTGRES_PASSWORD=${ODOO_DB_PASSWORD:?set in nexifai_odoo18_docker/.env}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data/pgdata
    networks:
      - odoo-net

  # ====== Nginx Proxy Manager (Reverse Proxy & SSL) ======
  npm_app:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: odoo18-nginx
    restart: always
    ports:
      - '80:80'    # HTTP traffic
      - '443:443'  # HTTPS traffic
      - '81:81'    # Admin UI: http://yourserverip:81
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - odoo-net

# ====== Volumes ======
volumes:
  db-data:
  npm_data:
  npm_letsencrypt:

# ====== Network ======
networks:
  odoo-net:
    driver: bridge
